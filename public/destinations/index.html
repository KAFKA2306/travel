<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fbfaf7" />
  <meta name="description" content="公式観光サイトのビジュアル、来週の実行計画、一次情報を一つにつなぐ旅先図鑑" />
  <title>旅先図鑑｜Wayweave</title>
  <link rel="stylesheet" href="/travel/site-shell.css" />
  <style>
    :root{--bg:#fbfaf7;--ink:#243653;--muted:#68758b;--line:rgba(67,87,119,.15);--blue:#8fb5ec;--blue-soft:#e9f1fc;--mint-soft:#eaf7f0;--rose-soft:#fcecf0;--apricot-soft:#fff2e3;--shadow:0 18px 50px rgba(76,91,125,.09);font-family:Inter,"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif}
    *{box-sizing:border-box}html{overflow-x:hidden}body{margin:0;color:var(--ink);background:radial-gradient(circle at 8% 0%,rgba(143,181,236,.24),transparent 31rem),radial-gradient(circle at 95% 18%,rgba(183,219,200,.25),transparent 29rem),var(--bg);overflow-x:hidden}.shell{width:min(1180px,calc(100% - 28px));margin:auto;min-width:0}.hero{padding:64px 0 28px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(270px,.75fr);gap:24px}.eyebrow{margin:0 0 12px;color:#5c76a2;font-size:12px;font-weight:900;letter-spacing:.14em}h1{margin:0;font-size:clamp(45px,7vw,82px);line-height:1;letter-spacing:-.065em}h1 em{font-style:normal;color:#648fc9}.lead{max-width:720px;margin:22px 0 0;color:var(--muted);font-size:15px;line-height:1.85}.rule{padding:22px;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.9);box-shadow:var(--shadow)}.rule b{font-size:18px}.rule p{margin:10px 0 0;color:var(--muted);font-size:12px;line-height:1.7}.toolbar{position:sticky;top:8px;z-index:20;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 15px;margin-bottom:18px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.94);box-shadow:0 10px 30px rgba(76,91,125,.08);backdrop-filter:blur(16px)}.filters{display:flex;gap:7px;flex-wrap:wrap}.filter{padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);font:850 11px inherit;cursor:pointer}.filter.active{background:var(--ink);color:#fff}.filter:focus-visible{outline:3px solid rgba(84,121,173,.25);outline-offset:2px}.count{color:var(--muted);font-size:12px;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px;padding-bottom:32px}.card{min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.92);box-shadow:var(--shadow)}.visual{display:block;position:relative;aspect-ratio:16/9;overflow:hidden;background:linear-gradient(135deg,var(--blue-soft),var(--mint-soft));color:inherit;text-decoration:none}.visual img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .25s}.visual:hover img{transform:scale(1.02)}.rank{position:absolute;left:14px;top:14px;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.92);font-size:10px;font-weight:950;box-shadow:0 7px 22px rgba(36,54,83,.16)}.source-badge{position:absolute;right:14px;bottom:14px;padding:6px 9px;border-radius:999px;background:rgba(36,54,83,.84);color:#fff;font-size:9px;font-weight:900}.fallback{display:grid;place-items:center;height:100%;padding:24px;text-align:center;color:#5b75a0;background:radial-gradient(circle at 25% 20%,rgba(143,181,236,.38),transparent 44%),radial-gradient(circle at 80% 80%,rgba(183,219,200,.48),transparent 42%),#f7f9fc;font-size:13px;font-weight:900;line-height:1.7}.body{padding:20px}.title{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.title h2{margin:0;font-size:25px}.title span{padding:6px 9px;border-radius:999px;background:var(--apricot-soft);font-size:10px;font-weight:900;white-space:nowrap}.route{margin:12px 0 0;color:var(--muted);font-size:12px;line-height:1.7}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}.tags i{padding:6px 8px;border-radius:999px;background:#f7f9fc;color:#60708a;font-size:9px;font-style:normal;font-weight:850}.actions{display:grid;grid-template-columns:1.08fr 1fr 1fr;gap:7px;margin-top:16px}.actions a{display:grid;place-items:center;min-height:42px;padding:7px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font-size:10px;font-weight:900;text-align:center;text-decoration:none}.actions a:first-child{background:var(--blue-soft)}.policy{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);color:var(--muted);font-size:9px;line-height:1.65}.policy summary{cursor:pointer;color:#5c76a2;font-weight:900}.policy p{margin:7px 0 0}.empty{grid-column:1/-1;padding:40px;border:1px dashed var(--line);border-radius:22px;text-align:center;color:var(--muted)}footer{display:flex;justify-content:space-between;gap:14px;padding:24px 0 36px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}@media(max-width:820px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}@media(max-width:580px){.shell{width:min(100% - 20px,1180px)}.hero{padding-top:42px}h1{font-size:46px}.toolbar{position:static;align-items:flex-start;flex-direction:column}.filter{min-height:38px}.body{padding:16px}.actions{grid-template-columns:repeat(3,minmax(0,1fr))}.actions a{font-size:9px;padding:6px 4px}.title{align-items:center}.title h2{font-size:23px}footer{flex-direction:column}}@media(prefers-reduced-motion:reduce){.visual img{transition:none}}
  </style>
</head>
<body>
  <main id="ww-main" class="shell">
    <section class="hero">
      <div><p class="eyebrow">DESTINATION × OFFICIAL MEDIA × PLAN</p><h1>写真で選び、<br><em>計画で決める。</em></h1><p class="lead">公式観光サイトや公式チャンネルが配信するビジュアルを入口にし、来週の旅程、交通条件、公式情報へ直接つなぎます。画像は出所と利用方針をデータとして管理し、無断転載のローカルコピーを標準にしません。</p></div>
      <aside class="rule"><b>ビジュアル運用</b><p>公式OG画像、公式フォトライブラリー、公式チャンネルを優先します。画像が取得できない場合もカードを壊さず、公式ページへ遷移できる状態を維持します。</p></aside>
    </section>
    <section class="toolbar" aria-label="旅先の絞り込み"><div class="filters" id="filters"></div><span class="count" id="count">読込中</span></section>
    <section class="grid" id="grid" aria-live="polite"></section>
    <footer><span><b>wayweave</b> · destination ontology</span><span>公式ビジュアル → 実行計画 → 一次情報</span></footer>
  </main>
  <script>
    const BASE='/travel';
    const escapeHtml=(value)=>String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
    const grid=document.getElementById('grid');
    const filters=document.getElementById('filters');
    const count=document.getElementById('count');
    let catalog=[];
    let media={};
    let active='all';
    const filterDefs=[['all','すべて'],['日帰り','日帰り'],['1泊2日','1泊2日'],['2泊3日','2泊3日'],['中部','中部'],['関東','関東'],['東北','東北'],['中国','中国']];

    const renderCard=(destination)=>{
      const record=media[destination.id]||{};
      const imageUrl=record.imageUrl||destination.overrideImageUrl||'';
      const sourceUrl=record.sourceUrl||destination.mediaPage||destination.officialUrl;
      const mode=record.mode||destination.mediaPolicy||'official-preview';
      const card=document.createElement('article');
      card.className='card';
      card.innerHTML=`
        <a class="visual" href="${escapeHtml(sourceUrl)}" target="_blank" rel="noreferrer" aria-label="${escapeHtml(destination.name)}の公式ビジュアルを開く">
          <span class="rank">RANK ${destination.rank}</span>
          <span class="source-badge">${escapeHtml(destination.publisher)}</span>
          ${imageUrl?`<img src="${escapeHtml(imageUrl)}" alt="${escapeHtml(destination.name)}の公式ビジュアル" loading="${destination.rank<=4?'eager':'lazy'}" decoding="async" referrerpolicy="no-referrer">`:'<span class="fallback">公式ビジュアルは配信元で確認できます。</span>'}
        </a>
        <div class="body">
          <div class="title"><h2>${escapeHtml(destination.name)}</h2><span>${escapeHtml(destination.prefecture)}</span></div>
          <p class="route">${escapeHtml(destination.routeSummary)}</p>
          <div class="tags">${destination.tags.map((tag)=>`<i>${escapeHtml(tag)}</i>`).join('')}</div>
          <div class="actions"><a href="${escapeHtml(destination.planUrl)}">具体計画</a><a href="${escapeHtml(destination.officialUrl)}" target="_blank" rel="noreferrer">公式観光</a><a href="${escapeHtml(sourceUrl)}" target="_blank" rel="noreferrer">写真の出所</a></div>
          <details class="policy"><summary>画像の出所と利用方針</summary><p>${escapeHtml(destination.licenseNote)}</p><p>${escapeHtml(mode)} · 検証 ${escapeHtml(record.verifiedAt||'未記録')}</p></details>
        </div>`;
      const image=card.querySelector('img');
      image?.addEventListener('error',()=>{
        const fallback=document.createElement('span');
        fallback.className='fallback';
        fallback.textContent='画像を表示できません。公式配信元で確認してください。';
        image.replaceWith(fallback);
      },{once:true});
      return card;
    };

    const render=()=>{
      const visible=catalog.filter((destination)=>active==='all'||destination.duration===active||destination.region===active);
      count.textContent=`${visible.length}件`;
      grid.replaceChildren(...visible.map(renderCard));
      if(!visible.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='条件に合う旅先がありません。';grid.appendChild(empty);}
    };

    filterDefs.forEach(([id,label])=>{
      const button=document.createElement('button');
      button.type='button';
      button.className=`filter${id==='all'?' active':''}`;
      button.textContent=label;
      button.addEventListener('click',()=>{
        active=id;
        document.querySelectorAll('.filter').forEach((item)=>item.classList.remove('active'));
        button.classList.add('active');
        render();
      });
      filters.appendChild(button);
    });

    Promise.all([
      fetch(`${BASE}/data/destinations.json`,{cache:'no-cache'}).then((response)=>{if(!response.ok)throw new Error('destination catalog');return response.json();}),
      fetch(`${BASE}/data/destination-media.json`,{cache:'no-cache'}).then((response)=>{if(!response.ok)throw new Error('media manifest');return response.json();})
    ]).then(([catalogData,mediaData])=>{
      catalog=catalogData.destinations;
      media=mediaData.destinations||{};
      render();
      const structured={"@context":"https://schema.org","@type":"ItemList",itemListElement:catalog.map((destination)=>({"@type":"ListItem",position:destination.rank,url:`https://kafka2306.github.io${destination.planUrl}`,name:destination.name}))};
      const script=document.createElement('script');
      script.type='application/ld+json';
      script.textContent=JSON.stringify(structured);
      document.head.appendChild(script);
    }).catch(()=>{
      count.textContent='取得失敗';
      const empty=document.createElement('div');
      empty.className='empty';
      empty.textContent='旅先データを読み込めませんでした。';
      grid.replaceChildren(empty);
    });
  </script>
  <script src="/travel/site-shell.js" defer></script>
</body>
</html>
