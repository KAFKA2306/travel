<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fbfaf7" />
  <meta name="description" content="公式観光サイトのビジュアル、来週の実行計画、一次情報を一つにつなぐ旅先図鑑" />
  <title>旅先図鑑｜Wayweave</title>
  <link rel="stylesheet" href="/travel/site-shell.css" />
  <style>
    :root{--bg:#fbfaf7;--ink:#243653;--muted:#68758b;--line:rgba(67,87,119,.15);--blue:#8fb5ec;--blue-soft:#e9f1fc;--mint-soft:#eaf7f0;--rose-soft:#fcecf0;--apricot-soft:#fff2e3;--shadow:0 18px 50px rgba(76,91,125,.09);font-family:Inter,"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif}
    *{box-sizing:border-box}html{overflow-x:hidden}body{margin:0;color:var(--ink);background:radial-gradient(circle at 8% 0%,rgba(143,181,236,.24),transparent 31rem),radial-gradient(circle at 95% 18%,rgba(183,219,200,.25),transparent 29rem),var(--bg);overflow-x:hidden}.shell{width:min(1180px,calc(100% - 28px));margin:auto;min-width:0}.hero{padding:64px 0 28px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(270px,.75fr);gap:24px}.eyebrow{margin:0 0 12px;color:#5c76a2;font-size:12px;font-weight:900;letter-spacing:.14em}h1{margin:0;font-size:clamp(45px,7vw,82px);line-height:1;letter-spacing:-.065em}h1 em{font-style:normal;color:#648fc9}.lead{max-width:720px;margin:22px 0 0;color:var(--muted);font-size:15px;line-height:1.85}.rule{padding:22px;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.9);box-shadow:var(--shadow)}.rule b{font-size:18px}.rule p{margin:10px 0 0;color:var(--muted);font-size:12px;line-height:1.7}.toolbar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 15px;margin-bottom:18px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.94);backdrop-filter:blur(16px)}.filters{display:flex;gap:7px;flex-wrap:wrap}.filter{padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);font:850 11px inherit;cursor:pointer}.filter.active{background:var(--ink);color:#fff}.count{color:var(--muted);font-size:12px;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px;padding-bottom:32px}.card{min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.92);box-shadow:var(--shadow)}.visual{display:block;position:relative;aspect-ratio:16/9;overflow:hidden;background:linear-gradient(135deg,var(--blue-soft),var(--mint-soft));color:inherit;text-decoration:none}.visual img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .25s}.visual:hover img{transform:scale(1.02)}.rank{position:absolute;left:14px;top:14px;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.92);font-size:10px;font-weight:950;box-shadow:0 7px 22px rgba(36,54,83,.16)}.fallback{display:grid;place-items:center;height:100%;padding:24px;text-align:center;color:#5b75a0;font-size:13px;font-weight:900;line-height:1.7}.body{padding:20px}.title{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.title h2{margin:0;font-size:25px}.title span{padding:6px 9px;border-radius:999px;background:var(--apricot-soft);font-size:10px;font-weight:900;white-space:nowrap}.route{margin:12px 0 0;color:var(--muted);font-size:12px;line-height:1.7}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}.tags i{padding:6px 8px;border-radius:999px;background:#f7f9fc;color:#60708a;font-size:9px;font-style:normal;font-weight:850}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:16px}.actions a{display:grid;place-items:center;min-height:39px;padding:7px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font-size:10px;font-weight:900;text-align:center;text-decoration:none}.actions a:first-child{background:var(--blue-soft)}.policy{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);color:var(--muted);font-size:9px;line-height:1.65}.empty{grid-column:1/-1;padding:40px;border:1px dashed var(--line);border-radius:22px;text-align:center;color:var(--muted)}footer{display:flex;justify-content:space-between;gap:14px;padding:24px 0 36px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}@media(max-width:820px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}@media(max-width:580px){.shell{width:min(100% - 20px,1180px)}h1{font-size:48px}.toolbar{align-items:flex-start;flex-direction:column}.actions{grid-template-columns:1fr}.title{flex-direction:column}.title span{align-self:flex-start}footer{flex-direction:column}}@media(prefers-reduced-motion:reduce){.visual img{transition:none}}
  </style>
</head>
<body>
  <main id="ww-main" class="shell">
    <section class="hero">
      <div><p class="eyebrow">DESTINATION × OFFICIAL MEDIA × PLAN</p><h1>写真で選び、<br><em>計画で決める。</em></h1><p class="lead">公式観光サイトや公式チャンネルが配信するビジュアルを入口にし、来週の旅程、交通条件、公式情報へ直接つなぎます。画像は出所と利用方針をデータとして管理し、無断転載のローカルコピーを標準にしません。</p></div>
      <aside class="rule"><b>ビジュアル運用</b><p>原則は公式ページのOG画像をリモート表示。利用許諾が明記された公式フォトライブラリーだけを別区分にし、制限のある素材は公式動画・公式ページへ誘導します。</p></aside>
    </section>
    <section class="toolbar" aria-label="旅先の絞り込み"><div class="filters" id="filters"></div><span class="count" id="count">読込中</span></section>
    <section class="grid" id="grid" aria-live="polite"></section>
    <footer><span><b>wayweave</b> · destination ontology</span><span>公式ビジュアル → 実行計画 → 一次情報</span></footer>
  </main>
  <script>
    const BASE='/travel';
    const escapeHtml=(v)=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
    const grid=document.getElementById('grid');const filters=document.getElementById('filters');const count=document.getElementById('count');let catalog=[];let media={};let active='all';
    const filterDefs=[['all','すべて'],['日帰り','日帰り'],['1泊2日','1泊2日'],['2泊3日','2泊3日'],['中部','中部'],['関東','関東'],['東北','東北'],['中国','中国']];
    const fallback='<div class="fallback">公式ビジュアルを取得できません。公式ページで確認してください。</div>';
    const render=()=>{const visible=catalog.filter(d=>active==='all'||d.duration===active||d.region===active);count.textContent=`${visible.length}件`;grid.innerHTML=visible.length?visible.map(d=>{const m=media[d.id]||{};const image=m.imageUrl||d.overrideImageUrl||'';const src=m.sourceUrl||d.mediaPage||d.officialUrl;return `<article class="card"><a class="visual" href="${escapeHtml(src)}" target="_blank" rel="noreferrer"><span class="rank">RANK ${d.rank}</span>${image?`<img src="${escapeHtml(image)}" alt="${escapeHtml(d.name)}の公式ビジュアル" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.parentElement.insertAdjacentHTML('beforeend',${JSON.stringify(fallback)});this.remove()">`:fallback}</a><div class="body"><div class="title"><h2>${escapeHtml(d.name)}</h2><span>${escapeHtml(d.prefecture)}</span></div><p class="route">${escapeHtml(d.routeSummary)}</p><div class="tags">${d.tags.map(t=>`<i>${escapeHtml(t)}</i>`).join('')}</div><div class="actions"><a href="${escapeHtml(d.planUrl)}">具体計画</a><a href="${escapeHtml(d.officialUrl)}" target="_blank" rel="noreferrer">公式観光</a><a href="${escapeHtml(src)}" target="_blank" rel="noreferrer">公式ビジュアル</a></div><p class="policy">${escapeHtml(d.licenseNote)}</p></div></article>`}).join(''):'<div class="empty">条件に合う旅先がありません。</div>'};
    filterDefs.forEach(([id,label])=>{const b=document.createElement('button');b.className=`filter${id==='all'?' active':''}`;b.textContent=label;b.addEventListener('click',()=>{active=id;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});filters.appendChild(b)});
    Promise.all([fetch(`${BASE}/data/destinations.json`,{cache:'no-cache'}).then(r=>r.json()),fetch(`${BASE}/data/destination-media.json`,{cache:'no-cache'}).then(r=>r.json())]).then(([c,m])=>{catalog=c.destinations;media=m.destinations||{};render();const ld={"@context":"https://schema.org","@type":"ItemList",itemListElement:catalog.map(d=>({"@type":"ListItem",position:d.rank,url:`https://kafka2306.github.io${d.planUrl}`,name:d.name}))};const s=document.createElement('script');s.type='application/ld+json';s.textContent=JSON.stringify(ld);document.head.appendChild(s)}).catch(()=>{count.textContent='取得失敗';grid.innerHTML='<div class="empty">旅先データを読み込めませんでした。</div>'});
  </script>
  <script src="/travel/site-shell.js" defer></script>
</body>
</html>
