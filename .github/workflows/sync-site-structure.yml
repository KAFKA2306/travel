name: Refresh official media and site structure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-site-structure.yml'
      - 'index.html'
      - 'planner/index.html'
      - 'vite.config.ts'
      - 'src/**'
      - 'scripts/sync-official-media.mjs'
      - 'scripts/apply-site-shell.mjs'
      - 'public/data/destinations.json'
      - 'public/data/site-ontology.json'
      - 'public/site-shell.css'
      - 'public/site-shell.js'
      - 'public/destinations/index.html'
      - 'public/sitemap/index.html'
      - 'public/sitemap.xml'
      - 'public/release.json'
  workflow_dispatch:
  schedule:
    - cron: '20 21 * * *'

permissions:
  contents: write

concurrency:
  group: refresh-site-structure
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve official destination media
        run: node scripts/sync-official-media.mjs

      - name: Apply global navigation shell
        run: node scripts/apply-site-shell.mjs

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: |
          npm run typecheck
          npm run build

      - name: Verify destination coverage and Pages output
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const catalog = JSON.parse(await readFile('public/data/destinations.json', 'utf8'));
          const media = JSON.parse(await readFile('public/data/destination-media.json', 'utf8'));
          const ontology = JSON.parse(await readFile('public/data/site-ontology.json', 'utf8'));
          if (catalog.destinations.length !== 10) throw new Error(`expected 10 destinations, got ${catalog.destinations.length}`);
          const missing = catalog.destinations.filter((item) => !media.destinations?.[item.id]?.imageUrl);
          if (missing.length) throw new Error(`missing official visuals: ${missing.map((item) => item.id).join(', ')}`);
          if (!ontology.views.some((view) => view.path === '/travel/' && view.id === 'home')) throw new Error('missing decision portal ontology');
          if (!ontology.views.some((view) => view.path === '/travel/planner/' && view.id === 'planner')) throw new Error('missing planner workspace ontology');
          NODE
          test -s dist/index.html
          test -s dist/planner/index.html
          test -s dist/destinations/index.html
          test -s dist/heat-escape-2026/index.html
          test -s dist/guides/index.html
          test -s dist/shenzhen/index.html
          test -s dist/sitemap/index.html
          grep -q '旅行の判断を始める' dist/index.html
          grep -q '/travel/site-shell.js' dist/planner/index.html
          grep -q '/travel/site-shell.js' dist/heat-escape-2026/index.html

      - name: Commit refreshed manifests and navigation
        run: |
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md index.html planner/index.html public/guides/index.html public/shenzhen/index.html public/heat-escape-2026/index.html public/data/destination-media.json
          git commit -m 'chore(site): refresh official media and navigation'
          git push
