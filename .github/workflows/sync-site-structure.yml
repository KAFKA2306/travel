name: Refresh official media and site structure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-site-structure.yml'
      - 'index.html'
      - 'planner/index.html'
      - 'vite.config.ts'
      - 'src/**'
      - 'scripts/sync-official-media.mjs'
      - 'scripts/apply-site-shell.mjs'
      - 'public/data/destinations.json'
      - 'public/data/destination-media.json'
      - 'public/data/official-content.json'
      - 'public/data/official-content-expansion.json'
      - 'public/data/official-content-growth.json'
      - 'public/data/site-ontology.json'
      - 'public/site-shell.css'
      - 'public/site-shell.js'
      - 'public/destinations/index.html'
      - 'public/official/index.html'
      - 'public/sitemap/index.html'
      - 'public/sitemap.xml'
      - 'public/release.json'
  workflow_dispatch:
  schedule:
    - cron: '20 21 * * *'

permissions:
  contents: write

concurrency:
  group: refresh-site-structure
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve official destination media
        run: node scripts/sync-official-media.mjs
      - name: Apply global navigation shell
        run: node scripts/apply-site-shell.mjs
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build
        run: |
          npm run typecheck
          npm run build
      - name: Verify destination, official-content and Pages coverage
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const catalog = JSON.parse(await readFile('public/data/destinations.json', 'utf8'));
          const media = JSON.parse(await readFile('public/data/destination-media.json', 'utf8'));
          const official = JSON.parse(await readFile('public/data/official-content.json', 'utf8'));
          const expansion = JSON.parse(await readFile('public/data/official-content-expansion.json', 'utf8'));
          const growth = JSON.parse(await readFile('public/data/official-content-growth.json', 'utf8'));
          const ontology = JSON.parse(await readFile('public/data/site-ontology.json', 'utf8'));
          if (catalog.destinations.length !== 10) throw new Error(`expected 10 planned destinations, got ${catalog.destinations.length}`);
          const missing = catalog.destinations.filter((item) => !media.destinations?.[item.id]?.imageUrl);
          if (missing.length) throw new Error(`missing official visuals: ${missing.map((item) => item.id).join(', ')}`);
          const officialRegions = [...official.destinations, ...expansion.destinations, ...growth.destinations];
          const officialItems = officialRegions.flatMap((destination) => destination.items);
          if (official.destinations.length !== 10) throw new Error(`expected 10 core official-content regions, got ${official.destinations.length}`);
          if (expansion.destinations.length !== 6) throw new Error(`expected 6 expansion regions, got ${expansion.destinations.length}`);
          if (growth.destinations.length !== 6) throw new Error(`expected 6 scheduled-growth regions, got ${growth.destinations.length}`);
          if (officialRegions.length !== 22) throw new Error(`expected 22 official-content regions, got ${officialRegions.length}`);
          if (officialItems.length !== 110) throw new Error(`expected 110 official-content items, got ${officialItems.length}`);
          if (official.stages.length !== 5) throw new Error(`expected 5 lifecycle stages, got ${official.stages.length}`);
          const ids = officialRegions.map((destination) => destination.id);
          if (new Set(ids).size !== ids.length) throw new Error('official content contains duplicate region ids');
          const expectedStages = new Set(official.stages.map((stage) => stage.id));
          for (const region of officialRegions) {
            if (!region.officialUrl?.startsWith('https://') || !region.imageUrl?.startsWith('https://')) throw new Error(`incomplete official region: ${region.id}`);
            if (region.items.length !== 5) throw new Error(`${region.id} must contain exactly 5 official items`);
            const stages = new Set(region.items.map((item) => item.stage));
            if (stages.size !== 5 || [...expectedStages].some((stage) => !stages.has(stage))) throw new Error(`${region.id} does not cover all lifecycle stages`);
            if (region.items.some((item) => !item.url.startsWith('https://'))) throw new Error(`${region.id} contains a non-HTTPS source`);
          }
          if (!ontology.views.some((view) => view.path === '/travel/official/' && view.id === 'official' && view.purpose.includes('22地域・110件'))) throw new Error('missing updated official content network ontology');
          NODE
          test -s dist/index.html
          test -s dist/planner/index.html
          test -s dist/destinations/index.html
          test -s dist/official/index.html
          test -s dist/heat-escape-2026/index.html
          test -s dist/guides/index.html
          test -s dist/shenzhen/index.html
          test -s dist/sitemap/index.html
          test -s dist/data/official-content-growth.json
          grep -q '公式コンテンツ・ネットワーク' dist/official/index.html
          grep -q 'official-content-growth.json' dist/official/index.html
      - name: Commit refreshed manifests and navigation
        run: |
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md index.html planner/index.html public/guides/index.html public/shenzhen/index.html public/heat-escape-2026/index.html public/destinations/index.html public/official/index.html public/data/destination-media.json
          git commit -m 'chore(site): refresh official media and navigation'
          git push
