name: Validate site structure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-site-structure.yml'
      - 'index.html'
      - 'planner/index.html'
      - 'vite.config.ts'
      - 'src/**'
      - 'scripts/apply-site-shell.mjs'
      - 'public/data/destinations.json'
      - 'public/data/destination-media.json'
      - 'public/data/official-content.json'
      - 'public/data/official-content-expansion.json'
      - 'public/data/official-content-growth.json'
      - 'public/data/site-areas.json'
      - 'public/data/site-ontology.json'
      - 'public/site-shell.css'
      - 'public/site-shell.js'
      - 'public/destinations/index.html'
      - 'public/kansai-museums/index.html'
      - 'public/official/index.html'
      - 'public/sitemap/index.html'
      - 'public/sitemap.xml'
      - 'public/release.json'
  workflow_dispatch:
  schedule:
    - cron: '20 21 * * *'

permissions:
  contents: read

concurrency:
  group: validate-site-structure
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build
        run: |
          npm run typecheck
          npm run build
      - name: Verify data, hierarchy and Pages coverage
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const catalog = JSON.parse(await readFile('public/data/destinations.json', 'utf8'));
          const media = JSON.parse(await readFile('public/data/destination-media.json', 'utf8'));
          const official = JSON.parse(await readFile('public/data/official-content.json', 'utf8'));
          const expansion = JSON.parse(await readFile('public/data/official-content-expansion.json', 'utf8'));
          const growth = JSON.parse(await readFile('public/data/official-content-growth.json', 'utf8'));
          const areas = JSON.parse(await readFile('public/data/site-areas.json', 'utf8'));
          const ontology = JSON.parse(await readFile('public/data/site-ontology.json', 'utf8'));
          const release = JSON.parse(await readFile('public/release.json', 'utf8'));
          const shell = await readFile('public/site-shell.js', 'utf8');
          const home = await readFile('index.html', 'utf8');

          if (catalog.destinations.length !== 10) throw new Error(`expected 10 planned destinations, got ${catalog.destinations.length}`);
          const missing = catalog.destinations.filter((item) => !media.destinations?.[item.id]?.imageUrl);
          if (missing.length) throw new Error(`missing official visuals: ${missing.map((item) => item.id).join(', ')}`);

          const officialRegions = [...official.destinations, ...expansion.destinations, ...growth.destinations];
          const addedRegions = [...expansion.destinations, ...growth.destinations];
          const officialItems = officialRegions.flatMap((destination) => destination.items);
          if (official.destinations.length !== 10) throw new Error(`expected 10 core official-content regions, got ${official.destinations.length}`);
          if (expansion.destinations.length < 6) throw new Error(`expected at least 6 expansion regions, got ${expansion.destinations.length}`);
          if (official.stages.length !== 5) throw new Error(`expected 5 lifecycle stages, got ${official.stages.length}`);
          const ids = officialRegions.map((destination) => destination.id);
          if (new Set(ids).size !== ids.length) throw new Error('official content contains duplicate region ids');
          const expectedStages = new Set(official.stages.map((stage) => stage.id));
          for (const region of officialRegions) {
            if (region.items.length !== 5) throw new Error(`${region.id} must contain exactly 5 official items`);
            if (region.items.some((item) => !expectedStages.has(item.stage))) throw new Error(`${region.id} contains an unknown lifecycle stage`);
            if (region.items.some((item) => !item.url.startsWith('https://'))) throw new Error(`${region.id} contains a non-HTTPS source`);
          }
          for (const region of addedRegions) {
            if (!region.officialUrl?.startsWith('https://')) throw new Error(`incomplete official region: ${region.id}`);
            const stages = new Set(region.items.map((item) => item.stage));
            if (stages.size !== 5 || [...expectedStages].some((stage) => !stages.has(stage))) throw new Error(`${region.id} does not cover all lifecycle stages`);
          }
          if (release.officialRegionCount !== officialRegions.length) throw new Error('release region count is stale');
          if (release.officialContentCoverage !== officialItems.length) throw new Error('release content count is stale');
          if (release.expansionRegionCount !== addedRegions.length) throw new Error('release expansion count is stale');
          const latestGrowth = growth.destinations.at(-1)?.id;
          if (latestGrowth && release.latestAddedRegion !== latestGrowth) throw new Error('release latestAddedRegion is stale');

          const expectedPrimary = ['map', 'areas', 'plans', 'live'];
          if (JSON.stringify(ontology.navigation?.primary) !== JSON.stringify(expectedPrimary)) throw new Error('primary navigation must remain map / areas / plans / live');
          const primaryViews = ontology.views.filter((view) => view.level <= 1).map((view) => view.id);
          if (JSON.stringify(primaryViews) !== JSON.stringify(expectedPrimary)) throw new Error(`unexpected top-level views: ${primaryViews.join(', ')}`);
          for (const view of ontology.views.filter((view) => view.level >= 2)) {
            if (!view.parentId || !expectedPrimary.includes(view.parentId)) throw new Error(`child view ${view.id} has no valid parentId`);
          }
          if (areas.areas.length < 5) throw new Error('site map must expose at least five area hubs');
          if (new Set(areas.areas.map((area) => area.id)).size !== areas.areas.length) throw new Error('duplicate area hub id');
          for (const area of areas.areas) {
            if (typeof area.lat !== 'number' || typeof area.lng !== 'number') throw new Error(`area ${area.id} has no map coordinate`);
            if (!area.primaryPath?.startsWith('/travel/')) throw new Error(`area ${area.id} has no internal primaryPath`);
          }
          if (!home.includes('id="overview-map"') || !home.includes('/travel/data/site-areas.json')) throw new Error('home must start from the geographic overview map');
          const primaryBlock = shell.match(/const primaryRoutes = \[([\s\S]*?)\];/)?.[1] || '';
          for (const label of ['大阪・京都ミュージアム', '公式特集', '猛暑回避10案', '深圳 Route Lab', 'サイト構造']) {
            if (primaryBlock.includes(label)) throw new Error(`child page leaked into primary navigation: ${label}`);
          }
          for (const label of ['地図', 'エリア', '旅程', '当日情報']) {
            if (!primaryBlock.includes(label)) throw new Error(`missing primary navigation item: ${label}`);
          }
          NODE
          test -s dist/index.html
          test -s dist/planner/index.html
          test -s dist/destinations/index.html
          test -s dist/kansai-museums/index.html
          test -s dist/official/index.html
          test -s dist/heat-escape-2026/index.html
          test -s dist/guides/index.html
          test -s dist/shenzhen/index.html
          test -s dist/sitemap/index.html
          test -s dist/data/site-areas.json
          test -s dist/data/official-content-growth.json
          grep -q 'id="overview-map"' dist/index.html
          grep -q 'AREA DIRECTORY' dist/destinations/index.html
          grep -q '公式コンテンツ・ネットワーク' dist/official/index.html
          grep -q 'official-content-growth.json' dist/official/index.html
