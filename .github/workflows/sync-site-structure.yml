name: Validate site structure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-site-structure.yml'
      - 'index.html'
      - 'planner/index.html'
      - 'vite.config.ts'
      - 'src/**'
      - 'scripts/apply-site-shell.mjs'
      - 'scripts/validate-site-structure.mjs'
      - 'public/data/destinations.json'
      - 'public/data/destination-media.json'
      - 'public/data/official-content.json'
      - 'public/data/official-content-expansion.json'
      - 'public/data/official-content-growth.json'
      - 'public/data/site-areas.json'
      - 'public/data/site-ontology.json'
      - 'public/site-shell.css'
      - 'public/site-shell.js'
      - 'public/related-links.css'
      - 'public/destinations/**'
      - 'public/kansai-museums/**'
      - 'public/official/**'
      - 'public/heat-escape-2026/**'
      - 'public/kyushu-2026/**'
      - 'public/kyushu-ferry-2026/**'
      - 'public/aso-2026/**'
      - 'public/kada-sea-daytrip-2026/**'
      - 'public/guides/**'
      - 'public/shenzhen/**'
      - 'public/sitemap/**'
      - 'public/sitemap.xml'
      - 'public/release.json'
  workflow_dispatch:
  schedule:
    - cron: '20 21 * * *'

permissions:
  contents: read

concurrency:
  group: validate-site-structure
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build
        run: |
          npm run typecheck
          npm run build
      - name: Verify data, hierarchy and Pages coverage
        run: node scripts/validate-site-structure.mjs
