name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/ui-audit/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install
        run: npm ci
      - name: Build
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: npm run build
      - name: Verify Pages artifact
        run: |
          test -s dist/index.html
          test -s dist/planner/index.html
          test -s dist/destinations/index.html
          test -s dist/kansai-museums/index.html
          test -s dist/official/index.html
          test -s dist/heat-escape-2026/index.html
          test -s dist/guides/index.html
          test -s dist/shenzhen/index.html
          test -s dist/sitemap/index.html
          test -s dist/kyushu-2026/index.html
          test -s dist/kyushu-2026/app.js
          test -s dist/kyushu-2026/styles.css
          test -s dist/kyushu-2026/discount-status.js
          test -s dist/kyushu-2026/discount-status.css
          test -s dist/data/site-areas.json
          test -s dist/data/official-content.json
          test -s dist/data/official-content-expansion.json
          test -s dist/data/official-content-growth.json
          test -s dist/data/kyushu-recovery-discount-2026.json
          test -s dist/data/kyushu-crossing-2026-11.json
          test -s dist/release.json
          grep -q 'id="overview-map"' dist/index.html
          grep -q 'DESTINATION DISCOVERY' dist/destinations/index.html
          grep -q '旅程ワークスペース' dist/planner/index.html
          grep -q '公式コンテンツ・ネットワーク' dist/official/index.html
          grep -q 'official-content-growth.json' dist/official/index.html
          grep -q 'KYUSHU 2026' dist/kyushu-2026/index.html
          grep -q '../data/kyushu-crossing-2026-11.json' dist/kyushu-2026/app.js
          grep -q '../data/kyushu-recovery-discount-2026.json' dist/kyushu-2026/discount-status.js
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const content = JSON.parse(await readFile('dist/data/official-content.json', 'utf8'));
          const expansion = JSON.parse(await readFile('dist/data/official-content-expansion.json', 'utf8'));
          const growth = JSON.parse(await readFile('dist/data/official-content-growth.json', 'utf8'));
          const release = JSON.parse(await readFile('dist/release.json', 'utf8'));
          const regions = [...content.destinations, ...expansion.destinations, ...growth.destinations];
          const addedRegions = [...expansion.destinations, ...growth.destinations];
          const items = regions.flatMap((destination) => destination.items);
          if (content.destinations.length !== 10) throw new Error(`expected 10 core official content regions, got ${content.destinations.length}`);
          if (expansion.destinations.length < 6) throw new Error(`expected at least 6 expansion regions, got ${expansion.destinations.length}`);
          if (new Set(regions.map((region) => region.id)).size !== regions.length) throw new Error('duplicate official content region id');
          if (content.stages.length !== 5) throw new Error(`expected 5 lifecycle stages, got ${content.stages.length}`);
          const validStages = new Set(content.stages.map((stage) => stage.id));
          for (const region of regions) {
            if (region.items.length !== 5) throw new Error(`${region.id} must contain exactly 5 official items`);
            if (region.items.some((item) => !validStages.has(item.stage))) throw new Error(`${region.id} contains an unknown lifecycle stage`);
            if (region.items.some((item) => !item.url.startsWith('https://'))) throw new Error(`${region.id} contains a non-HTTPS source`);
          }
          for (const region of addedRegions) {
            if (!region.officialUrl?.startsWith('https://')) throw new Error(`${region.id} has no HTTPS official URL`);
            const stages = new Set(region.items.map((item) => item.stage));
            if (stages.size !== 5 || [...validStages].some((stage) => !stages.has(stage))) throw new Error(`${region.id} does not cover all lifecycle stages`);
          }
          if (release.officialRegionCount !== regions.length) throw new Error(`release region count ${release.officialRegionCount} does not match ${regions.length}`);
          if (release.officialContentCoverage !== items.length) throw new Error(`release content count ${release.officialContentCoverage} does not match ${items.length}`);
          if (release.expansionRegionCount !== addedRegions.length) throw new Error('release expansion count is stale');
          const latestGrowth = growth.destinations.at(-1)?.id;
          if (latestGrowth && release.latestAddedRegion !== latestGrowth) throw new Error(`release latestAddedRegion ${release.latestAddedRegion} does not match ${latestGrowth}`);
          NODE
          test -n "$(find dist/assets -maxdepth 1 -type f -print -quit)"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy-and-audit:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout main for evidence
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Mark exact deployed revision
        run: git push --force origin "${GITHUB_SHA}:refs/heads/deployed-pages"

      - name: Setup Node for UI audit
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for Pages edge propagation
        run: sleep 30

      - name: Verify published public data
        run: |
          set -euo pipefail
          for source in public/data/*.json; do
            name="$(basename "$source")"
            published="/tmp/$name"
            curl --fail --silent --show-error --location --retry 3 --retry-delay 5 \
              "https://kafka2306.github.io/travel/data/$name" \
              --output "$published"
            cmp "$source" "$published"
          done

      - name: Verify Kyushu roadtrip runtime
        env:
          SITE_URL: https://kafka2306.github.io/travel
        run: node scripts/verify-kyushu-page.mjs

      - name: Capture desktop and mobile screenshots
        id: capture
        continue-on-error: true
        env:
          SITE_URL: https://kafka2306.github.io/travel
          SCREENSHOT_DIR: docs/ui-audit/latest
        run: node scripts/capture-pages.mjs

      - name: Upload screenshot bundle
        id: screenshots
        if: ${{ !cancelled() && (steps.capture.outcome == 'success' || steps.capture.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: travel-ui-screenshots-${{ github.run_id }}
          path: docs/ui-audit/latest
          if-no-files-found: error
          retention-days: 14

      - name: Record exact audit provenance
        if: ${{ !cancelled() && (steps.capture.outcome == 'success' || steps.capture.outcome == 'failure') }}
        env:
          ARTIFACT_ID: ${{ steps.screenshots.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.screenshots.outputs.artifact-url }}
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('docs/ui-audit/latest/report.json', 'utf8'));
          const metadata = {
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            artifactId: process.env.ARTIFACT_ID,
            artifactUrl: process.env.ARTIFACT_URL,
            sourceSha: process.env.SOURCE_SHA,
            generatedAt: report.generatedAt,
            captureOutcome: process.env.CAPTURE_OUTCOME,
          };
          await writeFile('docs/ui-audit/latest/artifact.json', `${JSON.stringify(metadata, null, 2)}\n`);
          NODE

      - name: Commit screenshot evidence
        if: ${{ !cancelled() && (steps.capture.outcome == 'success' || steps.capture.outcome == 'failure') }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ui-audit/latest
          if git diff --cached --quiet; then
            echo 'No screenshot changes.'
            exit 0
          fi
          git commit -m 'docs(ui): capture deployed Pages screens'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce screenshot audit result
        if: ${{ !cancelled() && steps.capture.outcome == 'failure' }}
        run: exit 1
