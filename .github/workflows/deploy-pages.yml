name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/ui-audit/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install
        run: npm ci
      - name: Build
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: npm run build
      - name: Verify Pages artifact
        run: |
          test -s dist/index.html
          test -s dist/planner/index.html
          test -s dist/destinations/index.html
          test -s dist/official/index.html
          test -s dist/heat-escape-2026/index.html
          test -s dist/guides/index.html
          test -s dist/shenzhen/index.html
          test -s dist/sitemap/index.html
          test -s dist/data/official-content.json
          test -s dist/data/official-content-expansion.json
          test -s dist/data/official-content-growth.json
          grep -q '旅行の判断を始める' dist/index.html
          grep -q '旅程ワークスペース' dist/planner/index.html
          grep -q '公式コンテンツ・ネットワーク' dist/official/index.html
          grep -q 'official-content-growth.json' dist/official/index.html
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const content = JSON.parse(await readFile('dist/data/official-content.json', 'utf8'));
          const expansion = JSON.parse(await readFile('dist/data/official-content-expansion.json', 'utf8'));
          const growth = JSON.parse(await readFile('dist/data/official-content-growth.json', 'utf8'));
          const regions = [...content.destinations, ...expansion.destinations, ...growth.destinations];
          const items = regions.flatMap((destination) => destination.items);
          if (content.destinations.length !== 10) throw new Error(`expected 10 core official content regions, got ${content.destinations.length}`);
          if (expansion.destinations.length !== 6) throw new Error(`expected 6 expansion regions, got ${expansion.destinations.length}`);
          if (growth.destinations.length !== 4) throw new Error(`expected 4 scheduled-growth regions, got ${growth.destinations.length}`);
          if (regions.length !== 20) throw new Error(`expected 20 official content regions, got ${regions.length}`);
          if (items.length !== 100) throw new Error(`expected 100 official content items, got ${items.length}`);
          if (new Set(regions.map((region) => region.id)).size !== regions.length) throw new Error('duplicate official content region id');
          if (content.stages.length !== 5) throw new Error(`expected 5 lifecycle stages, got ${content.stages.length}`);
          const validStages = new Set(content.stages.map((stage) => stage.id));
          for (const region of regions) {
            if (region.items.length !== 5) throw new Error(`${region.id} must contain exactly 5 official items`);
            const stages = new Set(region.items.map((item) => item.stage));
            if (stages.size !== 5 || [...validStages].some((stage) => !stages.has(stage))) throw new Error(`${region.id} does not cover all lifecycle stages`);
            if (region.items.some((item) => !item.url.startsWith('https://'))) throw new Error(`${region.id} contains a non-HTTPS source`);
          }
          NODE
          test -n "$(find dist/assets -maxdepth 1 -type f -print -quit)"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Checkout deployed revision
        uses: actions/checkout@v4
      - name: Mark deployed revision
        run: git push --force origin "${GITHUB_SHA}:refs/heads/deployed-pages"
