name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install
        run: npm ci
      - name: Build
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: npm run build
      - name: Verify Pages artifact
        run: |
          test -s dist/index.html
          test -s dist/planner/index.html
          test -s dist/destinations/index.html
          test -s dist/heat-escape-2026/index.html
          grep -q '旅行の判断を始める' dist/index.html
          grep -q '旅程ワークスペース' dist/planner/index.html
          test -n "$(find dist/assets -maxdepth 1 -type f -print -quit)"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Checkout deployed revision
        uses: actions/checkout@v4
      - name: Mark deployed revision
        run: git push --force origin "${GITHUB_SHA}:refs/heads/deployed-pages"
