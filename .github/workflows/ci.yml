name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:agent-entrypoint
      - run: npm run typecheck
      - run: npm run test:hotel-availability
      - run: npm run test:destinations
      - run: npm run test:kyushu-recovery-discount
      - run: npm run build
      - name: Verify clean checkout
        run: test -z "$(git status --porcelain --untracked-files=all)"
