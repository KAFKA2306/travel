name: Validate travel decision entry
on:
  pull_request:
    paths:
      - "public/decision/**"
      - ".github/workflows/uiux-decision-entry.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate decision hierarchy and accessibility
        run: |
          grep -q 'CANONICAL DECISION ENTRY' public/decision/index.html
          grep -q 'ACTIVE DECISION' public/decision/index.html
          test "$(grep -o 'button primary' public/decision/index.html | wc -l)" -eq 1
          grep -q 'font-size:16px' public/decision/decision.css
          grep -q 'min-height:44px' public/decision/decision.css
          grep -q 'href="../heat-escape-2026/"' public/decision/index.html
          grep -q 'href="../planner/"' public/decision/index.html
          grep -q 'href="../guides/"' public/decision/index.html
          grep -q 'prefers-reduced-motion' public/decision/decision.css
          grep -q 'kafka-signal-v1.0.0' public/decision/index.html
          grep -q '6cceef70ab3ad5d15bad972aab0b23d954fc1fd8' public/decision/kafka-signal.lock.json
          grep -q "fields=\['origin','date','days','compare'\]" public/decision/decision.js
