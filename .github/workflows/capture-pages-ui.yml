name: Capture deployed Pages UI manually

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-pages-ui-manual
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify main is deployed
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 24); do
            git fetch origin deployed-pages --quiet
            deployed_sha="$(git rev-parse origin/deployed-pages)"
            if [ "$deployed_sha" = "$SOURCE_SHA" ]; then
              echo "Verified deployed revision: $SOURCE_SHA"
              exit 0
            fi
            echo "Waiting for deployed-pages marker ($attempt/24): $deployed_sha"
            sleep 15
          done
          echo "::error::deployed-pages does not match main $SOURCE_SHA"
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture desktop and mobile screenshots
        id: capture
        continue-on-error: true
        env:
          SITE_URL: https://kafka2306.github.io/travel
          SCREENSHOT_DIR: docs/ui-audit/latest
        run: node scripts/capture-pages.mjs

      - name: Upload screenshot bundle
        id: screenshots
        if: ${{ !cancelled() && (steps.capture.outcome == 'success' || steps.capture.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: travel-ui-screenshots-${{ github.run_id }}
          path: docs/ui-audit/latest
          if-no-files-found: error
          retention-days: 14

      - name: Record artifact metadata
        if: ${{ !cancelled() && (steps.capture.outcome == 'success' || steps.capture.outcome == 'failure') }}
        env:
          ARTIFACT_ID: ${{ steps.screenshots.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.screenshots.outputs.artifact-url }}
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('docs/ui-audit/latest/report.json', 'utf8'));
          const metadata = {
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            artifactId: process.env.ARTIFACT_ID,
            artifactUrl: process.env.ARTIFACT_URL,
            sourceSha: process.env.SOURCE_SHA,
            generatedAt: report.generatedAt,
            captureOutcome: process.env.CAPTURE_OUTCOME,
          };
          await writeFile('docs/ui-audit/latest/artifact.json', `${JSON.stringify(metadata, null, 2)}\n`);
          NODE

      - name: Commit screenshot evidence
        if: ${{ !cancelled() && (steps.capture.outcome == 'success' || steps.capture.outcome == 'failure') }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add docs/ui-audit/latest
          if git diff --cached --quiet; then
            echo 'No screenshot changes.'
            exit 0
          fi
          git commit -m 'docs(ui): capture deployed Pages screens'
          git push

      - name: Enforce screenshot audit result
        if: ${{ !cancelled() && steps.capture.outcome == 'failure' }}
        run: exit 1
